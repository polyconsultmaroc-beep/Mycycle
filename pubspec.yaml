name: mycycle
description: Suivi du cycle menstruel en français, avec calendrier et estimations indicatives.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/mycycle_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/mycycle_icon.png"
  adaptive_icon_background: "#F8E9EE"
  adaptive_icon_foreground: "assets/mycycle_icon.png"
  min_sdk_android: 21
